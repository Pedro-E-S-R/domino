<style>
        .felt-bg {
            background-color: #1b4d2e;
            background-image: radial-gradient(circle at 50% 50%, rgba(27, 77, 46, 0.8) 0%, rgba(0, 54, 26, 1) 100%);
            box-shadow: inset 0 0 100px rgba(0,0,0,0.5);
        }
        .wood-border {
            border: 12px solid #45260f;
            border-image: linear-gradient(to right, #5c3a21, #45260f, #5c3a21) 1;
        }
        .domino-tile {
            background: #FFFFF0;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.3), inset 0px 1px 2px rgba(255,255,255,0.8);
            position: relative;
        }
        .domino-tile::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 10%;
            right: 10%;
            height: 1px;
            background: #D4A574;
            opacity: 0.5;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<div class="flex items-center gap-3">

<button class="material-symbols-outlined p-2 rounded-full hover:bg-tertiary-container transition-colors active:scale-95 duration-150">settings</button>

<div class="max-w-4xl w-full grid grid-cols-1 lg:grid-cols-2 gap-8 items-start">

<section class="bg-surface-container p-6 rounded-xl border-4 border-tertiary shadow-2xl space-y-8">
<h2 class="font-headline-md text-headline-md text-tertiary text-center">Configurar Partida</h2>
<!-- Connection Toggle -->
<div class="space-y-3">
<label class="font-label-lg text-label-lg text-tertiary-container flex items-center gap-2">
<span class="material-symbols-outlined text-base">language</span> MODO DE CONEXÃO
                    </label>
<div class="flex p-1 bg-tertiary-container rounded-lg">
<button class="flex-1 py-3 px-4 rounded-md font-label-lg text-label-lg bg-secondary-container text-on-secondary-container shadow-inner transition-all">Online</button>
<button class="flex-1 py-3 px-4 rounded-md font-label-lg text-label-lg text-secondary-fixed-dim hover:text-secondary-fixed transition-all">Wi-Fi Local</button>
</div>
</div>
<!-- Player Count Selection -->
<div class="space-y-3">
<label class="font-label-lg text-label-lg text-tertiary-container flex items-center gap-2">
<span class="material-symbols-outlined text-base">groups</span> QUANTIDADE DE JOGADORES
                    </label>
<div class="flex justify-center gap-6">
<button class="w-20 h-20 rounded-full border-4 border-primary-container flex flex-col items-center justify-center bg-primary text-white shadow-lg active:scale-95 transition-transform">
<span class="text-2xl font-bold">2</span>
<span class="text-[10px] font-bold">PLAYERS</span>
</button>
<button class="w-20 h-20 rounded-full border-4 border-outline-variant flex flex-col items-center justify-center bg-surface-container-highest text-on-surface-variant shadow-md hover:bg-secondary-fixed transition-colors active:scale-95 transition-transform">
<span class="text-2xl font-bold">4</span>
<span class="text-[10px] font-bold">PLAYERS</span>
</button>
</div>
</div>
<!-- Name Input -->
<div class="space-y-3">
<label class="font-label-lg text-label-lg text-tertiary-container flex items-center gap-2">
<span class="material-symbols-outlined text-base">person</span> SEU APELIDO
                    </label>
<input class="w-full px-4 py-4 rounded-xl border-2 border-tertiary bg-white font-body-lg text-tertiary focus:ring-4 focus:ring-secondary-fixed outline-none transition-all" placeholder="Ex: Mestre do Doblo" type="text" value="Jogador Pro"/>
</div>
<!-- Create Room Button -->
<button class="w-full py-5 bg-gradient-to-b from-[#D4A574] to-[#B08A5B] hover:from-[#E5B685] hover:to-[#D4A574] text-tertiary font-headline-md text-headline-md rounded-xl shadow-[0px_6px_0px_#8D6E4A] active:shadow-none active:translate-y-1 transition-all flex items-center justify-center gap-3">
                    Criar Sala <span class="material-symbols-outlined">add_circle</span>
</button>
</section>

<p class="font-label-lg text-label-lg text-tertiary-container opacity-80">Aguardando jogadores...</p>
</div>

<div class="text-center">

</div>

<div class="grid grid-cols-2 gap-3">
<div class="flex items-center gap-3 bg-primary-container p-3 rounded-lg border border-primary">

</div>
<div class="flex flex-col">
<span class="text-white font-label-lg leading-tight">Jogador Pro</span>
<span class="text-secondary-fixed-dim text-[10px] uppercase font-bold tracking-wider">Host</span>
</div>
</div>
<div class="flex items-center gap-3 bg-white/40 p-3 rounded-lg border border-outline-variant">
<div class="w-10 h-10 rounded-full border-2 border-tertiary bg-surface-container overflow-hidden">
<img alt="Player Avatar" class="w-full h-full" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDI9_Z0BCx9m2MRXU5GDyP5zn6vcV5AKsQkzd4ACKHFKT3vaZBdgIkHVsUvQ3hAVnTVio19h7b8GgdORi8CHQXTpge6i-3b5sGoH_Dqs1onAdKd4y-oXdsitkGnZnLreifUbEFhVc68Sqf-9RVpvXyDhQYOoysBON2Xd0ffVoYapVdqjHvnLMENopaOO59HeFZdz4AlRSlrXZlTuqLbBJNiyl7Dm76rN8e755WkMHa9Olg-WSwt6ffUojB9n-Fnhjzkh0I5hnZrth0"/>
</div>
<div class="flex flex-col">
<span class="text-tertiary font-label-lg leading-tight">Zeca Pagodin</span>

</div>
</div>
<div class="flex items-center justify-center p-3 rounded-lg border-2 border-dashed border-outline-variant opacity-50">
<span class="material-symbols-outlined text-outline">hourglass_empty</span>
</div>

</div>
</div>
</div>
<div class="pt-4">
<button class="w-full py-4 bg-tertiary text-secondary-fixed font-label-lg text-label-lg rounded-xl opacity-50 cursor-not-allowed">

<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-xl px-4 py-1 shadow-inner translate-y-0.5 transition-all" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_circle</span>
<span class="font-label-sm text-label-sm">Jogar</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary-fixed-dim opacity-70 px-4 py-1 hover:opacity-100 hover:text-secondary-fixed transition-colors" href="#">
<span class="material-symbols-outlined">group</span>
<span class="font-label-sm text-label-sm">Amigos</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary-fixed-dim opacity-70 px-4 py-1 hover:opacity-100 hover:text-secondary-fixed transition-colors" href="#">
<span class="material-symbols-outlined">leaderboard</span>
<span class="font-label-sm text-label-sm">Placar</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary-fixed-dim opacity-70 px-4 py-1 hover:opacity-100 hover:text-secondary-fixed transition-colors" href="#">
<span class="material-symbols-outlined">menu_book</span>

</a>

<div class="fixed top-32 right-10 rotate-12 pointer-events-none hidden lg:block opacity-40">
<div class="domino-tile w-16 h-32 rounded-lg p-2 flex flex-col justify-between items-center">
<div class="grid grid-cols-2 gap-1">
<div class="w-3 h-3 rounded-full bg-[#000080]"></div>
<div class="w-3 h-3 rounded-full bg-[#000080]"></div>
<div class="w-3 h-3 rounded-full bg-[#000080]"></div>
<div class="w-3 h-3 rounded-full bg-[#000080]"></div>
</div>
<div class="grid grid-cols-2 gap-1">
<div class="w-3 h-3 rounded-full bg-[#000080]"></div>
<div class="w-3 h-3 rounded-full bg-[#000080]"></div>

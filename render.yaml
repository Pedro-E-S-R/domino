services:
  - type: web
    name: domino-server
    runtime: node
    plan: free
    buildCommand: |
      npm install --include=dev
      npm run -w @domino/engine build
      npm run -w @domino/contracts build
      npm run -w @domino/server build
    startCommand: node packages/server/dist/index.js --port=$PORT --host=0.0.0.0
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
